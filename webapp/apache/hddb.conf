# hddb — Festplattendatenbank at /hddb/
#
# Include this from the classic-computing.org vhost (website.conf).
# Follows the mod_auth_openidc setup of oldcomputers.conf; the OAuth2
# client "hddb" must exist in the forum ACP with scopes
# openid + nickname + profile + groups and redirect URI
# https://classic-computing.org/hddb/oidc/redirect .
#
# OIDCClientSecret and OIDCCryptoPassphrase live in the root-only file
# included below.

Alias /hddb /var/www/hddb/html

<Directory /var/www/hddb/html>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

Include /etc/apache2/oidc-hddb-secrets.conf

OIDCProviderMetadataURL https://forum.classic-computing.de/index.php?open-id-configuration/
OIDCClientID hddb
OIDCRedirectURI https://classic-computing.org/hddb/oidc/redirect
# The nickname claim is populated by the profile scope (the standalone
# nickname scope delivers it as null); retrostar and exhibitron use the
# same scope combination against this forum.
OIDCScope "openid nickname profile groups"

# the numeric user id is the reliable identity claim
OIDCRemoteUserClaim sub

OIDCStateMaxNumberOfCookies 15 true
OIDCSessionInactivityTimeout 3600
OIDCSessionMaxDuration 28800
OIDCUserInfoRefreshInterval 900

# https://classic-computing.org/hddb/oidc/redirect?info=json shows the
# claims of the logged-in user (handy to verify the group name)
OIDCInfoHook iat access_token id_token userinfo session

# Reading is public; everything under /hddb/auth/ is for club members.
# API calls get a plain 401/403 instead of a login redirect.
<Location /hddb/auth/>
    AuthType openid-connect
    Require claim groups:Vereinsmitglieder
    OIDCUnAuthAction 401
</Location>

# The interactive login entry point keeps redirect semantics: it sends the
# browser to the forum login and, once back, login.php returns to the app.
<Location /hddb/auth/login.php>
    AuthType openid-connect
    Require claim groups:Vereinsmitglieder
    OIDCUnAuthAction auth
</Location>

# The OIDC callback; any logged-in forum user may reach it, which also
# makes ?info=json usable to debug claims of non-members.
<Location /hddb/oidc/redirect>
    AuthType openid-connect
    Require valid-user
</Location>
